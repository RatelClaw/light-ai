[project]
name = "light-ai"
version = "0.1.0"
description = "Universal Data Handler - On-premises data management system with automated ingestion, cleaning, and intelligent retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "polars>=0.20.0",
    # Database engines
    "duckdb>=0.9.0",
    "chromadb>=0.4.0",
    # OpenRouter API integration
    "openai>=1.0.0",
    "httpx>=0.25.0",
    # Web API framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",  # For file uploads
    # File processing
    "openpyxl>=3.1.0",  # Excel files
    "PyPDF2>=3.0.0",    # PDF files
    "python-docx>=1.1.0",  # DOCX files
    "beautifulsoup4>=4.12.0",  # HTML files
    "python-magic>=0.4.27",  # File type detection
    "markdown>=3.5.0",  # Markdown processing
    "numpy>=1.24.0",  # Numerical operations
    # Configuration and utilities
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Testing dependencies (dev)
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "streamlit>=1.50.0",
    "cryptography>=46.0.3",
    "pytest-asyncio>=1.2.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88
