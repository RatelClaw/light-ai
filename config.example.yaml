# Example configuration file for Universal Data Handler
# Copy this to config.yaml and customize as needed

# OpenRouter API configuration (required)
openrouter:
  api_key: "your-openrouter-api-key-here"  # Required - get from https://openrouter.ai
  base_url: "https://openrouter.ai/api/v1"
  default_model: "anthropic/claude-3.5-sonnet"
  embedding_model: "text-embedding-3-small"
  timeout_seconds: 30

# Storage configuration
storage:
  base_directory: "."  # Base directory for all data storage
  max_file_size_mb: 500  # Maximum file size for uploads

# Data processing configuration
processing:
  chunk_size_tokens: 512  # Size of text chunks for unstructured data
  chunk_overlap_tokens: 50  # Overlap between chunks
  cache_ttl_minutes: 5  # Cache time-to-live in minutes
  max_parallel_workers: 4  # Maximum parallel workers for bulk operations
  streaming_threshold_rows: 10000  # Row count threshold for streaming results

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file_enabled: true  # Enable file logging
  console_enabled: true  # Enable console logging
  max_file_size_mb: 10  # Maximum log file size before rotation
  backup_count: 5  # Number of backup log files to keep